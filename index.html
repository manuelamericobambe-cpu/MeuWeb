<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ango-Fucture | Página Principal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: clamp(2em, 6vw, 3em);
            margin-bottom: 15px;
        }

        p {
            font-size: clamp(1em, 3vw, 1.2em);
            margin-bottom: 40px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            background: white;
            color: #667eea;
            padding: 16px 45px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        footer {
            margin-top: 40px;
            font-size: 0.9em;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ango-Fucture</h1>
        <p>Bem-vindo ao projeto do Milton josé 
        Clique no botão abaixo para aceder à página local.</p>
        
        <a href="Loca.html" class="btn">Entrar →</a>
    </div>

    <footer>
        © 2026 Ango-Fucture
    </footer>

</body>
</html>
